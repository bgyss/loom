[package]
name = "loom-context"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
description = "Context management logic and services for Loom agents"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
loom-context-core = { path = "../loom-context-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
