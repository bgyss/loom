[package]
name = "loom-multi-agent"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
description = "Multi-agent coordination system implementation for Loom"

[dependencies]
# Internal crates
loom-multi-agent-core = { path = "../loom-multi-agent-core" }
loom-multi-agent-events = { path = "../loom-multi-agent-events" }
loom-server-multi-agent = { path = "../loom-server-multi-agent" }

# Async runtime
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tokio-test = "0.4"
