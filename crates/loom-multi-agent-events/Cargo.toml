[package]
name = "loom-multi-agent-events"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
description = "Event system for Loom multi-agent coordination"

[dependencies]
loom-multi-agent-core = { path = "../loom-multi-agent-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
