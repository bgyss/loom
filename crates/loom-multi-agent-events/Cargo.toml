[package]
name = "loom-multi-agent-events"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
description = "Event system for Loom multi-agent coordination"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
loom-multi-agent-core = { path = "../loom-multi-agent-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"], optional = true }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7"], optional = true }

[features]
default = []
persistence = ["sqlx", "uuid"]

[dev-dependencies]
tokio-test = "0.4"
