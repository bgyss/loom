[package]
name = "loom-server-context"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
description = "Server-side repository layer for Loom context management"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
loom-context-core = { path = "../loom-context-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["full", "test-util"] }
